if(document.activeElement!==g)g.value=me.gender;
if(document.activeElement!==a)a.value=me.archetype;
const canStart=room.players.length>=6&&room.players.every(p=>p.is_ready);
$('#hostBox').innerHTML=host?`<button id="startBtn" class="btn primary wide" ${canStart?'':'disabled title="Нужно минимум 6 игроков и готовность каждого"'}>НАЧАТЬ ИГРУ ►</button><p class="note">Старт доступен, когда собралось минимум 6 игроков и все участники нажали «Я готов».</p>`:'';

let G=null,V=null,gch=null,hello=null;
const sh=a=>[...a].sort(()=>Math.random()-.5),alive=()=>G.players.filter(p=>p.alive);
function gsend(p){gch&&gch.send({type:'broadcast',event:'m',payload:p})}
function renderStarted(){lobbyBuilt=false;if(!gch)initGame();renderGame()}
function initGame(){
const host=!!me.is_host;
gch=db.channel('game-'+room.id,{config:{broadcast:{self:false}}});
gch.on('broadcast',{event:'m'},({payload})=>onMsg(payload)).subscribe(st=>{if(st==='SUBSCRIBED'){if(host)hostStart();else gsend({t:'hello',from:me.player_id})}});
if(!host)hello=setInterval(()=>{if(!V)gsend({t:'hello',from:me.player_id})},3000);
}
function onMsg(m){if(m.t==='views'){V=m.views[me.player_id]||null;renderGame()}else if(me.is_host)handle(m)}
function act(m){if(me.is_host)handle(m);else gsend(m)}
function hostStart(){
const sv=localStorage.getItem('kv_G_'+room.id);
if(sv)G=JSON.parse(sv);else{
const ps=room.players.map(p=>({id:p.player_id,name:p.player_name,alive:true,role:'p'}));
const c=ps.length>=20?3:ps.length>=11?2:1;sh(ps).slice(0,c).forEach(p=>p.role='c');
G={phase:'night',day:1,target:room.target_days,players:ps,votes:{},night:{},log:['Рейс начался. Ночь 1: Людоеды выбирают жертву.'],winner:null};}
push();
}
function viewFor(pid){const m=G.players.find(p=>p.id===pid),end=!!G.winner,day=G.phase==='day';
return{phase:G.phase,day:G.day,target:G.target,log:G.log.slice(-8),winner:G.winner,me:m?{role:m.role,alive:m.alive}:null,
mates:m&&m.role==='c'?G.players.filter(p=>p.role==='c'&&p.id!==pid).map(p=>p.name):[],
players:G.players.map(p=>({id:p.id,name:p.name,alive:p.alive,role:(end||!p.alive)?p.role:null})),
my:(day?G.votes[pid]:G.night[pid])||null,done:Object.keys(day?G.votes:G.night).length,
need:day?alive().length:alive().filter(p=>p.role==='c').length}}
function push(){localStorage.setItem('kv_G_'+room.id,JSON.stringify(G));const views={};G.players.forEach(p=>views[p.id]=viewFor(p.id));gsend({t:'views',views});V=views[me.player_id]||null;renderGame()}
function nm(id){return G.players.find(p=>p.id===id).name}
function handle(m){
if(m.t==='hello')return push();
if(G.winner)return;
const f=G.players.find(p=>p.id===m.from);if(!f||!f.alive)return;
if(m.t==='vote'&&G.phase==='day'){if(m.to!=='skip'&&!(G.players.find(p=>p.id===m.to)||{}).alive)return;G.votes[m.from]=m.to;if(alive().every(p=>G.votes[p.id]))return endPhase()}
if(m.t==='night'&&G.phase==='night'&&f.role==='c'){const t=G.players.find(p=>p.id===m.to);if(!t||!t.alive||t.role==='c')return;G.night[m.from]=m.to;if(alive().filter(p=>p.role==='c').every(p=>G.night[p.id]))return endPhase()}

}
function leader(o){const c={};Object.values(o).forEach(v=>{if(v!=='skip')c[v]=(c[v]||0)+1});const mx=Math.max(0,...Object.values(c)),w=Object.keys(c).filter(k=>c[k]===mx);return mx?{id:w[Math.floor(Math.random()*w.length)],tie:w.length>1}:null}
function endPhase(){
if(G.phase==='night'){const t=leader(G.night);if(t){const p=G.players.find(x=>x.id===t.id);p.alive=false;G.log.push(`Утро ${G.day}: ночью пропал ${p.name}. Он был Пассажиром.`)}else G.log.push(`Утро ${G.day}: ночь прошла тихо, никто не пропал.`);G.night={};G.phase='day'}
else{const t=leader(G.votes);if(t&&!t.tie){const p=G.players.find(x=>x.id===t.id);p.alive=false;G.log.push(`Суд ${G.day}: изгнан ${p.name}. Он был ${p.role==='c'?'ЛЮДОЕДОМ':'Пассажиром'}.`)}else G.log.push(`Суд ${G.day}: голоса разделились или все воздержались, никого не изгнали.`);G.votes={};G.day++;G.phase='night';if(!G.winner&&G.day<=G.target)G.log.push(`Ночь ${G.day}: Людоеды выбирают жертву.`)}
const c=alive().filter(p=>p.role==='c').length,h=alive().length-c;
if(c===0){G.winner='p';G.log.push('Все Людоеды изгнаны. Пассажиры победили!')}
else if(c>=h){G.winner='c';G.log.push('Людоедов стало не меньше, чем пассажиров. Победа Людоедов!')}
else if(G.day>G.target){G.winner='p';G.log.push('Ковчег достиг планеты! Пассажиры победили!')}
push();
}

const v=V,isC=v.me&&v.me.role==='c',aliveMe=v.me&&v.me.alive,day=v.phase==='day',host=me.is_host;
const title=v.winner?(v.winner==='p'?'ПОБЕДА ПАССАЖИРОВ':'ПОБЕДА ЛЮДОЕДОВ'):(day?`ДЕНЬ ${v.day} · СУД`:`НОЧЬ ${v.day}`);
const canAct=!v.winner&&aliveMe&&(day||isC);
const btns=p=>{if(!canAct||!p.alive||p.id===me.player_id)return '';if(!day&&p.role==='c')return '';return `<button class="btn ${v.my===p.id?'primary':'paperbtn'}" data-id="${p.id}">${day?(v.my===p.id?'ВАШ ГОЛОС':'ГОЛОСОВАТЬ'):(v.my===p.id?'ЖЕРТВА ВЫБРАНА':'ВЫБРАТЬ ЖЕРТВУ')}</button>`};
const mates=v.mates.length?` · союзники: ${v.mates.map(esc).join(', ')}`:'';
$('#app').innerHTML=`<section class="panel"><div class="eyebrow">РЕЙС · ДОЛЕТЕТЬ НУЖНО ДО ДНЯ ${v.target}</div><h1 class="heading">${title}</h1>

${!v.winner?`<p class="note">${day?'Обсудите вслух, затем голосуйте':'Ночь: Людоеды выбирают жертву, остальные ждут'}. Выбрали: ${v.done} из ${v.need}</p>`:''}
<div class="players">${v.players.map(p=>`<div class="player" style="${p.alive?'':'opacity:.55'}"><strong>${esc(p.name)}${p.id===me.player_id?' (вы)':''}</strong><div class="note">${p.alive?'на борту':'выбыл'}${p.role?' · '+(p.role==='c'?'Людоед':'Пассажир'):''}</div>${btns(p)}</div>`).join('')}</div>
${canAct&&day?`<button class="btn paperbtn wide" id="skipVote">${v.my==='skip'?'ВЫ ВОЗДЕРЖАЛИСЬ':'ВОЗДЕРЖАТЬСЯ'}</button>`:''}
<div class="section-title">ХРОНИКА</div>${v.log.map(l=>`<p class="note">${esc(l)}</p>`).join('')}
${host&&!v.winner?'<button class="btn paperbtn wide" id="forceBtn">ЗАВЕРШИТЬ ФАЗУ ДОСРОЧНО</button>':''}</section>`;
document.querySelectorAll('#app .player [data-id]').forEach(b=>b.onclick=()=>act({t:day?'vote':'night',from:me.player_id,to:b.dataset.id}));
const sk=$('#skipVote');if(sk)sk.onclick=()=>act({t:'vote',from:me.player_id,to:'skip'});
const fb=$('#forceBtn');if(fb)fb.onclick=()=>act({t:'force',from:me.player_id});
}
async function createRoom(){
if(busy)return;
if(!db)return showError('Сайт не подключён к Supabase.');
const host=$('#hostName').value.trim(),title=$('#arkTitle').value.trim(),max=Number($('#maxPlayersSelect').value==='custom'?$('#maxPlayersCustom').value:$('#maxPlayersSelect').value),days=Number($('#targetDaysSelect').value==='custom'?$('#targetDaysCustom').value:$('#targetDaysSelect').value);
if(!host||!title)return showError('Укажите имя капитана и название Ковчега.');
if(!Number.isInteger(max)||max<6||max>30)return showError('Количество игроков должно быть от 6 до 30.');
if(!Number.isInteger(days)||days<4||days>10)return showError('Количество дней должно быть от 4 до 10.');
busy=true;$('#createBtn').disabled=true;
try{
let data=null,error=null;
for(let i=0;i<5;i++){
({data,error}=await db.from('kovcheg_rooms').insert({code:code(),host_name:host,ark_title:title,max_players:max,target_days:days,status:'waiting'}).select().single());
if(!error||error.code!=='23505')break;
}
if(error)return showError(error.message);
room={...data,players:[]};
const pid=uuid();
const {data:p,error:pe}=await db.from('kovcheg_players').insert({room_id:room.id,player_id:pid,player_name:host,gender:'male',archetype:'pragmatist',is_host:true,is_ready:false}).select().single();
if(pe){room=null;return showError(pe.message)}
me=p;await enterRoom();
}catch(e){room=null;showError('Ошибка соединения: '+(e.message||e))}
finally{busy=false;const b=$('#createBtn');if(b)b.disabled=false}
}
async function joinRoom(c,n){
if(busy)return;
if(!db)return showError('Сайт не подключён к Supabase.');
if(!/^[A-Z0-9]{5}$/.test(c)||!n)return showError('Введите корректный код комнаты и своё имя.');
busy=true;$('#joinBtn').disabled=true;
try{
const {data:r,error}=await db.from('kovcheg_rooms').select('*').eq('code',c).eq('status','waiting').maybeSingle();
if(error||!r)return showError('Комната не найдена или игра уже началась.');
const {count}=await db.from('kovcheg_players').select('*',{count:'exact',head:true}).eq('room_id',r.id);
if(count>=r.max_players)return showError('В комнате уже нет свободных мест.');
const pid=uuid();
const {data:p,error:pe}=await db.from('kovcheg_players').insert({room_id:r.id,player_id:pid,player_name:n,gender:'male',archetype:'pragmatist',is_host:false,is_ready:false}).select().single();
if(pe)return showError(pe.message);
room={...r,players:[]};me=p;await enterRoom();
}catch(e){showError('Ошибка соединения: '+(e.message||e))}
finally{busy=false;const b=$('#joinBtn');if(b)b.disabled=false}
}
async function enterRoom(){
localStorage.setItem('kovcheg_room',room.code);localStorage.setItem('kovcheg_pid',me.player_id);
history.replaceState({},'',`?room=${room.code}`);
if(channel){db.removeChannel(channel);channel=null}
if(poller)clearInterval(poller);
lobbyBuilt=false;
await refreshRoom();
channel=db.channel('room-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'kovcheg_players',filter:`room_id=eq.${room.id}`},refreshRoom).on('postgres_changes',{event:'*',schema:'public',table:'kovcheg_rooms',filter:`id=eq.${room.id}`},refreshRoom).subscribe();
poller=setInterval(refreshRoom,5000);
}
async function refreshRoom(){
if(!db||!room||!me)return;
const rid=room.id,pid=me.player_id;
const [{data:r},{data:ps},{data:p}]=await Promise.all([db.from('kovcheg_rooms').select('*').eq('id',rid).maybeSingle(),db.from('kovcheg_players').select('*').eq('room_id',rid).order('created_at'),db.from('kovcheg_players').select('*').eq('room_id',rid).eq('player_id',pid).maybeSingle()]);
if(!room||room.id!==rid)return;
if(!r)return;
if(ps&&!p&&!ps.some(x=>x.player_id===pid)){forgetRoom();return joinScreen()}
room={...r,players:ps||[]};if(p)me=p;
if(room.status==='started'){renderStarted();return}
if(!lobbyBuilt)lobby();else updateLobby();
}
function forgetRoom(){if(channel){db.removeChannel(channel);channel=null}if(poller){clearInterval(poller);poller=null}room=null;me=null;lobbyBuilt=false;localStorage.removeItem('kovcheg_room');localStorage.removeItem('kovcheg_pid')}
async function saveCharacter(){
const name=$('#charName').value.trim()||me.player_name;
const {error}=await db.from('kovcheg_players').update({player_name:name,gender:$('#gender').value,archetype:$('#archetype').value}).eq('id',me.id);
if(error)return showError(error.message);
if(me.is_host&&name!==room.host_name)await db.from('kovcheg_rooms').update({host_name:name}).eq('id',room.id);
$('#charName').value=name;
await refreshRoom();
}
async function toggleReady(){const {error}=await db.from('kovcheg_players').update({is_ready:!me.is_ready}).eq('id',me.id);if(error)return showError(error.message);await refreshRoom()}
async function startGame(){if(!me.is_host)return;await refreshRoom();if(room.players.length<6||!room.players.every(p=>p.is_ready))return showError('Нужно минимум 6 игроков и готовность каждого.');const {error}=await db.from('kovcheg_rooms').update({status:'started'}).eq('id',room.id);if(error)return showError(error.message);await refreshRoom()}
async function leaveRoom(){
const myRoom=room,myMe=me;
forgetRoom();
try{
if(myMe?.id){
await db.from('kovcheg_players').delete().eq('id',myMe.id);
if(myMe.is_host&&myRoom){
const next=myRoom.players.find(p=>p.id!==myMe.id);
if(next){await db.from('kovcheg_players').update({is_host:true}).eq('id',next.id);await db.from('kovcheg_rooms').update({host_name:next.player_name}).eq('id',myRoom.id)}
}
}
}catch(e){}
history.replaceState({},'',location.pathname);home();
}
async function resume(){
if(!db)return incoming?joinScreen():home();
const c=incoming||localStorage.getItem('kovcheg_room'),pid=localStorage.getItem('kovcheg_pid');
if(!c||!pid)return incoming?joinScreen():home();
const {data:r}=await db.from('kovcheg_rooms').select('*').eq('code',c).maybeSingle();
if(!r)return incoming?joinScreen():home();
const {data:p}=await db.from('kovcheg_players').select('*').eq('room_id',r.id).eq('player_id',pid).maybeSingle();
if(!p)return joinScreen();
room={...r,players:[]};me=p;await enterRoom();
}
resume();
</script>
</body></html>
